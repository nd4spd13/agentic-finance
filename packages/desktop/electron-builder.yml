appId: com.clad.desktop
productName: Clad
directories:
  output: release
  buildResources: build
# `files` is the app-side allowlist (out/, resources/, package.json). Runtime
# deps (node_modules, including the @clad/* workspace packages) are always
# pulled in separately by electron-builder's dependency walk, then filtered
# through these same glob patterns — the negations below trim workspace/dev
# artifacts (TS sources, tsconfig/vitest config, test suites, docs) that ride
# along on our own `workspace:*` packages and on third-party deps, so only
# what's needed to run resolves inside the ASAR. Verify with:
#   npx @electron/asar list release/mac-*/Clad.app/Contents/Resources/app.asar
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/@clad/*/src/**'
  - '!node_modules/**/tsconfig*.json'
  - '!node_modules/**/vitest.config.*'
  - '!node_modules/**/*.{test,spec}.{js,mjs,cjs}'
  - '!node_modules/**/{test,tests,__tests__,example,examples}/**'
  - '!node_modules/**/{README.md,readme.md,CHANGELOG.md,changelog.md,HISTORY.md,.editorconfig,.eslintrc,.eslintrc.*,.nycrc,.travis.yml,appveyor.yml}'
asarUnpack:
  - '**/*.node'
mac:
  icon: build/icon.icns
  category: public.app-category.finance
  # Ad-hoc/unsigned distribution until D4.4 (gated on Apple Developer
  # enrollment). `identity: null` tells electron-builder to skip the
  # code-signing identity search entirely rather than fail (or warn) trying
  # to find a "Developer ID Application" cert that doesn't exist yet — this
  # must produce a clean unsigned build both locally and in CI, where no
  # keychain identities are present at all.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
npmRebuild: false
